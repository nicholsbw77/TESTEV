[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tesladash"
version = "0.1.0"
description = "Customizable Qt CAN dashboard for a 2013 Tesla Model S (listen-only)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
socketcan = ["python-can>=4.0"]
obdlink = ["pyserial>=3.5"]

[project.scripts]
tesladash = "tesladash.app:main"

[tool.setuptools]
packages = ["tesladash"]
