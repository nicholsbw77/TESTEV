# Builds a release APK on GitHub's Linux runners. No signing config is
# required — Flutter falls back to the debug keystore, which produces an
# APK you can sideload for testing (install via ADB or "Install from
# unknown sources" on the phone). For Play Store distribution, wire in a
# real release keystore later.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/bms-clear]
    paths:
      - lib/**
      - android/**
      - plugins/**
      - pubspec.yaml
      - .github/workflows/android-apk.yml
  pull_request:
    branches: [main]
    paths:
      - lib/**
      - android/**
      - plugins/**
      - pubspec.yaml
      - .github/workflows/android-apk.yml

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Rename APK with short SHA
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/TESTEV-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TESTEV-apk
          path: out/TESTEV-*.apk
          retention-days: 14
