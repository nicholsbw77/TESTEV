name: ea_accessory
description: ExternalAccessory (MFi) serial bridge for the OBDLink MX+ on iOS.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.1
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: EaAccessoryPlugin
